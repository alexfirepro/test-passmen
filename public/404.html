<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>ROYAL NOIR | Клубная карта & Кабинет гостя</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // Redirects 404 to index.html with route preserved
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background: #07050d; color: #d4af37; font-family: sans-serif; text-align: center; padding-top: 20vh;">
    <h2>Загрузка ROYAL NOIR...</h2>
  </body>
</html>
